<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="익명으로 자유롭게 이야기를 나누는 대나무숲 게시판">
  <title>대나무숲 - 익명 게시판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="대나무숲 홈">
        <span class="brand-mark" aria-hidden="true">竹</span>
        <span><strong>대나무숲</strong><small>익명 자유게시판</small></span>
      </a>
      <nav aria-label="주 메뉴"><a href="#board">게시판</a><a href="#footer">이용안내</a></nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="board-title" aria-labelledby="pageTitle">
      <div>
        <h1 id="pageTitle">대나무숲</h1>
        <p>하고 싶었던 이야기를 자유롭게 남겨주세요.</p>
      </div>
      <button class="primary-button" id="newPostButton" type="button">글쓰기</button>
    </section>

    <section class="board" id="board" aria-label="게시판">
      <div class="list-panel">
        <div class="panel-heading">
          <h2>전체글</h2>
          <span class="post-count" id="postCount">0개의 글</span>
        </div>
        <div class="search-box">
          <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="제목 + 내용 검색" aria-label="게시글 검색">
          <button type="button" id="clearSearchButton" class="clear-search-btn" aria-label="검색 초기화" style="display:none;">×</button>
        </div>
        <div class="post-list" id="postList"></div>
      </div>

      <article class="detail-panel" id="detailPanel" aria-live="polite"></article>
    </section>
  </main>

  <footer id="footer"><span>대나무숲</span><p>비밀번호는 글과 댓글을 수정·삭제할 때 필요합니다.</p></footer>

  <dialog id="postDialog" aria-labelledby="dialogTitle">
    <form id="postForm">
      <div class="dialog-heading">
        <div><p class="dialog-kicker">대나무숲</p><h2 id="dialogTitle">새 글 쓰기</h2></div>
        <button class="icon-button" id="closeDialogButton" type="button" aria-label="닫기">×</button>
      </div>
      <input type="hidden" id="postId">
      <label>제목<input id="titleInput" type="text" maxlength="80" placeholder="어떤 이야기를 남길까요?" required></label>
      <label>작성자<input id="authorInput" type="text" maxlength="24" placeholder="이름을 입력해 주세요" required></label>
      <label>비밀번호<input id="passwordInput" type="password" minlength="4" maxlength="64" autocomplete="new-password" placeholder="수정·삭제할 때 사용할 비밀번호" required></label>
      <label>본문<textarea id="contentInput" rows="8" maxlength="5000" placeholder="당신의 이야기를 들려주세요." required></textarea></label>
      <div class="form-actions"><button class="text-button" id="cancelButton" type="button">취소</button><button class="primary-button" type="submit">저장하기</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <span class="confirm-icon" aria-hidden="true">!</span>
      <h2 id="confirmTitle">글을 삭제할까요?</h2>
      <p>삭제한 글과 작성된 모든 댓글은 다시 되돌릴 수 없어요.</p>
      <label class="confirm-password">비밀번호<input id="deletePasswordInput" type="password" minlength="4" maxlength="64" autocomplete="current-password" required></label>
      <div class="form-actions"><button class="text-button" value="cancel" formnovalidate>취소</button><button class="danger-button" id="confirmDeleteButton" value="confirm">삭제하기</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="브라우저에 안전하게 저장되는 간단한 게시판">
  <title>담벼락 — 나만의 게시판</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="담벼락 홈">
      <span class="brand-mark" aria-hidden="true">담</span>
      <span><strong>담벼락</strong><small>생각을 가볍게 붙여두는 곳</small></span>
    </a>
    <button class="primary-button" id="newPostButton" type="button"><span aria-hidden="true">＋</span> 새 글 쓰기</button>
  </header>

  <main class="page-shell">
    <section class="intro" aria-labelledby="pageTitle">
      <p class="eyebrow">MY LITTLE BOARD</p>
      <h1 id="pageTitle">오늘의 이야기를<br><em>남겨보세요.</em></h1>
      <p>여기에 쓴 글은 이 브라우저에만 저장돼요.<br>부담 없이 쓰고, 언제든 다시 고쳐보세요.</p>
    </section>

    <section class="board" aria-label="게시판">
      <div class="list-panel">
        <div class="panel-heading">
          <div><span class="section-number">01</span><h2>게시글</h2></div>
          <span class="post-count" id="postCount">0개의 글</span>
        </div>
        <div class="post-list" id="postList"></div>
      </div>

      <article class="detail-panel" id="detailPanel" aria-live="polite"></article>
    </section>
  </main>

  <footer><span>담벼락</span><p>모든 기록은 당신의 브라우저 안에 머뭅니다.</p></footer>

  <dialog id="postDialog" aria-labelledby="dialogTitle">
    <form id="postForm">
      <div class="dialog-heading">
        <div><p class="eyebrow">WRITE A NOTE</p><h2 id="dialogTitle">새 글 쓰기</h2></div>
        <button class="icon-button" id="closeDialogButton" type="button" aria-label="닫기">×</button>
      </div>
      <input type="hidden" id="postId">
      <label>제목<input id="titleInput" type="text" maxlength="80" placeholder="어떤 이야기를 남길까요?" required></label>
      <label>작성자<input id="authorInput" type="text" maxlength="24" placeholder="이름을 입력해 주세요" required></label>
      <label>본문<textarea id="contentInput" rows="8" maxlength="5000" placeholder="당신의 이야기를 들려주세요." required></textarea></label>
      <div class="form-actions"><button class="text-button" id="cancelButton" type="button">취소</button><button class="primary-button" type="submit">저장하기</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle">
    <form method="dialog">
      <span class="confirm-icon" aria-hidden="true">!</span>
      <h2 id="confirmTitle">글을 삭제할까요?</h2>
      <p>삭제한 글은 다시 되돌릴 수 없어요.</p>
      <div class="form-actions"><button class="text-button" value="cancel">취소</button><button class="danger-button" id="confirmDeleteButton" value="confirm">삭제하기</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
